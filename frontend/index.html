<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireTrail — Tailor. Apply. Track.</title>
    <meta
      name="description"
      content="HireTrail tailors your resume to every posting, saves jobs from six job boards in one click, and catches recruiter replies in your inbox. Free and open source."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Paint the signed-in user's theme before anything renders, from the
         cache utils/themeDom.ts keeps (same shape as its BootCache). -->
    <!-- A visitor landing on "/" (no signed-in theme cached) sees the landing,
         which opens on black: paint black now so nothing flashes white first.
         Visitors on the public pages also start fetching the landing's font
         (pages/Landing/font.css) now, so the headline doesn't swap faces. -->
    <style>html.lp-boot, html.lp-boot body { background: #000; }</style>
    <script>
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem("hiretrail-theme-boot") || "null");
          if (!b) {
            var path = location.pathname;
            if (path === "/") document.documentElement.classList.add("lp-boot");
            if (path === "/" || path === "/about" || path === "/privacy" || path === "/terms") {
              var font = document.createElement("link");
              font.rel = "preload";
              font.as = "font";
              font.type = "font/woff2";
              font.crossOrigin = "anonymous";
              font.href = "/fonts/inter-landing.woff2";
              document.head.appendChild(font);
            }
            return;
          }
          var root = document.documentElement;
          var dark = b.mode === "system" ? window.matchMedia("(prefers-color-scheme: dark)").matches : b.dark;
          if (dark) root.classList.add("dark");
          if (b.tokens) for (var k in b.tokens) root.style.setProperty(k, b.tokens[k]);
          if (b.meta) document.querySelector('meta[name="theme-color"]').setAttribute("content", b.meta);
        } catch (e) { /* no cache or no storage — the app paints once it loads */ }
      })();
    </script>
    <link rel="canonical" href="https://hiretrail.manavkaneria.me/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HireTrail" />
    <meta property="og:url" content="https://hiretrail.manavkaneria.me/" />
    <meta property="og:title" content="HireTrail — Tailor. Apply. Track." />
    <meta
      property="og:description"
      content="Tailor your resume to every posting, save jobs from six boards in one click, and catch recruiter replies in your inbox. Free and open source."
    />
    <meta property="og:image" content="https://hiretrail.manavkaneria.me/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HireTrail — Tailor. Apply. Track. Without the spreadsheet." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HireTrail — Tailor. Apply. Track." />
    <meta
      name="twitter:description"
      content="Tailor your resume to every posting, save jobs from six boards in one click, and catch recruiter replies in your inbox. Free and open source."
    />
    <meta name="twitter:image" content="https://hiretrail.manavkaneria.me/og.jpg" />
    <meta name="twitter:image:alt" content="HireTrail — Tailor. Apply. Track. Without the spreadsheet." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
